<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
<title id="title">How a market appears</title>
<desc id="desc">A provider brings inventory, quotes terms and settles accepted agreements. A second independent provider can quote the same pair; it need not wait for the first settlement.</desc>
<defs>
<marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L8 4 L0 8" fill="#D9A441"/>
</marker>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#E8EBF0}.strong{font-weight:600}.small{font-size:15px;fill:#AAB1BC}.gold{fill:#D9A441}.eyebrow{font-size:13px;letter-spacing:1.6px;fill:#D9A441}.box{fill:#12161D;stroke:#3A414D}.accent{fill:#12161D;stroke:#D9A441}.arrow{fill:none;stroke:#D9A441;stroke-width:1.8;marker-end:url(#tip)}.edge{fill:none;stroke:#68717F;stroke-width:1.3}.icon{fill:none;stroke:#D9A441;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="720" height="560" rx="12" fill="#0C0F14"/>
<text x="28" y="34" class="eyebrow" text-anchor="start">HOW A MARKET APPEARS</text>
<text x="43" y="103" class="gold" text-anchor="start">01</text>
<rect x="96" y="60" width="596" height="78" rx="10" class="box"/>
<text x="112" y="90" class="strong" text-anchor="start">Inventory</text>
<text x="112" y="116" class="small" text-anchor="start">M1 + external asset</text>
<path d="M48 118 L48 184" class="arrow"/>
<text x="43" y="209" class="gold" text-anchor="start">02</text>
<rect x="96" y="166" width="596" height="78" rx="10" class="box"/>
<text x="112" y="196" class="strong" text-anchor="start">Quote</text>
<text x="112" y="222" class="small" text-anchor="start">Pair · amount · price · expiry</text>
<path d="M48 224 L48 290" class="arrow"/>
<text x="43" y="315" class="gold" text-anchor="start">03</text>
<rect x="96" y="272" width="596" height="78" rx="10" class="box"/>
<text x="112" y="302" class="strong" text-anchor="start">Settlement</text>
<text x="112" y="328" class="small" text-anchor="start">Accepted terms → completed legs</text>
<path d="M48 330 L48 396" class="arrow"/>
<text x="43" y="421" class="gold" text-anchor="start">04</text>
<rect x="96" y="378" width="596" height="78" rx="10" class="box"/>
<text x="112" y="408" class="strong" text-anchor="start">Second provider</text>
<text x="112" y="434" class="small" text-anchor="start">Independent inventory and quote</text>
<text x="28" y="509" class="small" text-anchor="start">Another provider can enter at any time under the same role rules.</text>
<text x="28" y="535" class="small" text-anchor="start">Competition is a choice by participants, not a consensus event.</text>
</svg>
