[book]
title = "BATHRON Documentation"
authors = ["BATHRON"]
language = "en"
src = "src"

[output.html]
site-url = "/docs/"
default-theme = "navy"
preferred-dark-theme = "navy"
additional-css = ["theme/bathron.css"]
