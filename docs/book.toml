[book]
title = "BATHRON Documentation"
authors = ["BATHRON"]
language = "en"
src = "src"

[output.html]
site-url = "/docs/"
default-theme = "navy"
preferred-dark-theme = "navy"
additional-css = ["theme/bathron.css"]
git-repository-url = "https://github.com/bathron-network/bathron-network.github.io"
