# Deploiement du site sur GitHub Pages.
#
# Toutes les actions sont epinglees par SHA de commit — aucun tag mobile. Chaque
# SHA a ete confirme via l'endpoint faisant foi
# GET /repos/<owner>/<repo>/git/ref/tags/<tag>, qui renvoie l'objet commit vise
# par le tag :
#
#   actions/checkout               v4.4.0  11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-python           v5.6.0  a26af69be951a213d495a4c3e4e4022e16d87065
#   actions/upload-pages-artifact  v3.0.1  56afc609e74202658d3ffba0e8f6dda462b719fa
#   actions/deploy-pages           v4.0.5  d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
#
# Chacun est la derniere version de la ligne majeure deja utilisee ici, donc
# l'epinglage ne change aucun comportement — il retire seulement la possibilite
# qu'un tag soit deplace sous nos pieds.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: v0.4.52
      # SHA-256 officiel de l'asset, tel que publié par l'API GitHub Releases
      # (GET /repos/rust-lang/mdBook/releases/tags/v0.4.52 -> .assets[].digest).
      # Non calculé localement. Si MDBOOK_VERSION change sans mettre à jour cette
      # valeur, sha256sum --check échoue et le déploiement s'arrête : fail-closed.
      MDBOOK_SHA256: c0b903f01dd8f4edc644372ad2b80b1fdddd12552d37b6a098657cbd8eddd768
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # ---------------------------------------------------------------
      # Portes i18n de la page d'accueil.
      #
      # Un SEUL script — i18n/ci-check.sh — définit les contrôles, et il est
      # appelé à l'identique par .github/workflows/i18n-check.yml (validation
      # de PR, non déployante). Les contrôles qui gardent une PR et ceux qui
      # gardent une publication ne peuvent donc pas diverger.
      #
      # Ce chemin n'installe RIEN : ni apt-get update, ni gettext, ni paquet
      # Python. Le générateur n'utilise que la bibliothèque standard, et le cas
      # « fuzzy » du test de mutation injecte le drapeau de façon déterministe.
      # Publier le site ne dépend donc pas de la disponibilité des dépôts
      # Ubuntu. La compatibilité avec le vrai msgmerge est vérifiée à part, par
      # i18n/msgmerge-compat.sh, dans un job non bloquant hors déploiement.
      #
      # Épinglage : actions/setup-python est fixé au SHA de commit de la v5.6.0
      # (source : GET /repos/actions/setup-python/tags, commit a26af69…, daté
      # 2025-04-24), et Python à une version patch exacte présente dans
      # actions/python-versions pour linux-x64. Un tag mobile comme @v5 ou une
      # version « 3.12 » ne sont pas des épinglages.
      # ---------------------------------------------------------------
      - name: Set up Python 3.12.14 (pinned action, pinned interpreter)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12.14'

      - name: Record the interpreter actually used
        run: |
          python3 -VV
          python3 -c "import sys; assert sys.version_info[:3] == (3, 12, 14), sys.version"

      - name: i18n gates (same script as the pull-request workflow)
        run: bash i18n/ci-check.sh

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          tarball="$(mktemp -d)/mdbook.tar.gz"
          # Téléchargement dans un fichier : plus de « curl | tar », qui extrait
          # l'archive au fil de l'eau et ne peut donc rien vérifier avant.
          # --fail : un HTTP 4xx/5xx devient une erreur au lieu d'une page HTML
          # extraite comme si c'était l'outil.
          curl --fail --show-error --location --silent \
            -o "$tarball" \
            "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${MDBOOK_SHA256}  ${tarball}" | sha256sum --check --strict -
          # Extraction SEULEMENT après validation.
          tar xzf "$tarball" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build docs
        run: mdbook build docs

      - name: Assemble site
        run: |
          mkdir -p _site/docs
          cp index.html CNAME robots.txt sitemap.xml 404.html _site/
          # Every generated language, taken from the language table rather than
          # a hand-kept list, so adding a language needs no workflow edit.
          python3 i18n/i18n.py languages | awk '$NF != "(source)" {print $NF}' |
          while read -r out; do
            mkdir -p "_site/$out"
            cp "$out/index.html" "_site/$out/"
          done
          cp -r img _site/
          cp -r docs/book/. _site/docs/

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
