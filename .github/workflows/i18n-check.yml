# Preserve the stable required check; enforce English-only publication on every PR.
name: i18n check

on:
  pull_request:
  workflow_dispatch:

# Read-only. No pages:write, no id-token:write, nothing else.
permissions:
  contents: read

concurrency:
  group: i18n-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  i18n:
    name: i18n gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.12.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12.14'

      - name: Check interpreter
        run: python3 -c "import sys; assert sys.version_info[:3] == (3, 12, 14), sys.version"

      - name: English-only site and legacy redirects
        run: bash i18n/ci-check.sh
